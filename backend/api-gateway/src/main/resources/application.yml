server:
  port: 8888

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # User Service Routes
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/v1/${segment}

        # Quiz Service Routes
        - id: quiz-service
          uri: lb://quiz-service
          predicates:
            - Path=/api/v1/questions/**, /api/v1/quizzes/**, /api/v1/categories/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/v1/${segment}

        # Progress Service Routes
        - id: progress-service
          uri: lb://progress-service
          predicates:
            - Path=/api/v1/attempts/**, /api/v1/progress/**, /api/v1/achievements/**, /api/v1/analytics/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/v1/${segment}

      # Global CORS configuration for MFEs
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:9000"
              - "http://localhost:8080"
              - "http://localhost:8081"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:default-dev-secret-change-in-production-min-256-bits}
