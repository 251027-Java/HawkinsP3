# Logstash Pipeline Configuration
# Parses logs from Filebeat and sends to Elasticsearch

input {
  beats {
    port => 5044
  }
  
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Add timestamp if not present
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }

  # Parse Spring Boot JSON logs
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "log"
      skip_on_invalid_json => true
    }
    
    if [log][level] {
      mutate {
        add_field => { "level" => "%{[log][level]}" }
      }
    }
    
    if [log][logger_name] {
      mutate {
        add_field => { "logger" => "%{[log][logger_name]}" }
      }
    }
  }

  # Extract service name from container/pod name
  if [container][name] {
    mutate {
      add_field => { "service_name" => "%{[container][name]}" }
    }
  } else if [kubernetes][pod][name] {
    mutate {
      add_field => { "service_name" => "%{[kubernetes][pod][name]}" }
    }
  }

  # Clean up service name (remove pilotquiz- prefix)
  if [service_name] =~ /^pilotquiz-/ {
    mutate {
      gsub => [ "service_name", "^pilotquiz-", "" ]
    }
  }

  # Add environment tag
  mutate {
    add_field => { "environment" => "${ENVIRONMENT:dev}" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "pilotquiz-logs-%{+YYYY.MM.dd}"
    
    # ILM settings
    ilm_enabled => true
    ilm_rollover_alias => "pilotquiz-logs"
    ilm_pattern => "{now/d}-000001"
    ilm_policy => "pilotquiz-ilm-policy"
  }
  
  # Debug output (comment out in production)
  # stdout { codec => rubydebug }
}
