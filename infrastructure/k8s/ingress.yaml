# PilotQuiz Ingress Configuration
# Routes all traffic through nginx ingress controller with path-based routing
# Uses rewrite-target to strip path prefix when forwarding to backends
# Apply with: kubectl apply -f ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pilotquiz-ingress
  namespace: pilotquiz-frontend
  annotations:
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-User-Role"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # React MFE assets - strips /auth prefix
          # /auth/pilotquiz-react-auth.js → /pilotquiz-react-auth.js
          - path: /auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: mfe-react-auth
                port:
                  number: 8080
          
          # Angular MFE assets - strips /quiz prefix
          # /quiz/main.js → /main.js
          - path: /quiz(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: mfe-angular-quiz
                port:
                  number: 8081
          
          # Frontend shell (root config) - pass through as-is
          # Uses dummy first group so $2 contains the full path
          # /pilotquiz-root-config.js → /pilotquiz-root-config.js
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: root-config
                port:
                  number: 80
---
# API Gateway Ingress - handles all /api/* routes  
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: pilotquiz-backend
  annotations:
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-User-Role"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # /api/v1/users → /v1/users (strips /api prefix)
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-gateway
                port:
                  number: 8888
