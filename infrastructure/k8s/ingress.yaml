# PilotQuiz Ingress Configuration
# Routes all traffic through nginx ingress controller with path-based routing
# Apply with: kubectl apply -f ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pilotquiz-ingress
  namespace: pilotquiz-frontend
  annotations:
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-User-Role"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # React MFE assets - must match before root
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: mfe-react-auth
                port:
                  number: 8080
          
          # Angular MFE assets - must match before root
          - path: /quiz
            pathType: Prefix
            backend:
              service:
                name: mfe-angular-quiz
                port:
                  number: 8081
          
          # Frontend shell (root config) - catch-all for everything else
          - path: /
            pathType: Prefix
            backend:
              service:
                name: root-config
                port:
                  number: 80
---
# API Gateway Ingress - handles all /api/* routes  
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: pilotquiz-backend
  annotations:
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-User-Role"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8888
