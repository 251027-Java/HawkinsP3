# Ingress Configuration for Minikube
# Uses nginx ingress controller
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pilotquiz-ingress
  namespace: pilotquiz-frontend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
    # Main application (root config)
    - http:
        paths:
          # Frontend shell
          - path: /
            pathType: Prefix
            backend:
              service:
                name: root-config
                port:
                  number: 9000
          
          # React MFE assets
          - path: /pilotquiz-react-auth.js
            pathType: Exact
            backend:
              service:
                name: mfe-react-auth
                port:
                  number: 8080
          
          # Angular MFE assets
          - path: /mfe-angular-quiz
            pathType: Prefix
            backend:
              service:
                name: mfe-angular-quiz
                port:
                  number: 8081
          
          # API Gateway (all /api routes)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8888
---
# Separate ingress for API Gateway in backend namespace
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: pilotquiz-backend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-gateway
                port:
                  number: 8888
