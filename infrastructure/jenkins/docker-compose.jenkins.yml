# Jenkins Docker Compose Configuration
# Runs Jenkins controller on the build agent EC2

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins
    restart: unless-stopped
    user: root
    ports:
      - "80:8080"      # Jenkins UI
      - "50000:50000"    # Agent communication
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for builds
      - /usr/bin/docker:/usr/bin/docker            # Docker CLI from host
      - ./jenkins.yaml:/var/jenkins_home/jenkins.yaml:ro  # JCasC config
    environment:
      - JAVA_OPTS=-Xmx2g -Xms512m -Djenkins.install.runSetupWizard=false
      - JENKINS_OPTS=--prefix=/
      - CASC_JENKINS_CONFIG=/var/jenkins_home/jenkins.yaml
      # Set these in .env file or override at runtime
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:-admin123}
      - JENKINS_DEV_PASSWORD=${JENKINS_DEV_PASSWORD:-dev123}
      - JENKINS_URL=${JENKINS_URL:-http://localhost:8080/}
    networks:
      - jenkins-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  jenkins_home:
    name: jenkins_home
    external: true

networks:
  jenkins-network:
    driver: bridge
