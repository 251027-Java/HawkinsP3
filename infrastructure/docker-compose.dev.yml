# Docker Compose for Local Development Infrastructure
# Start this before running backend services locally

services:
  # PostgreSQL for User Service
  postgres-user:
    image: postgres:15-alpine
    container_name: pilotquiz-postgres-user
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: ${POSTGRES_USER:-pilotquiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pilotquiz123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilotquiz -d userdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for Quiz Service
  postgres-quiz:
    image: postgres:15-alpine
    container_name: pilotquiz-postgres-quiz
    environment:
      POSTGRES_DB: quizdb
      POSTGRES_USER: ${POSTGRES_USER:-pilotquiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pilotquiz123}
    ports:
      - "5433:5432"
    volumes:
      - postgres_quiz_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilotquiz -d quizdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for Progress Service
  postgres-progress:
    image: postgres:15-alpine
    container_name: pilotquiz-postgres-progress
    environment:
      POSTGRES_DB: progressdb
      POSTGRES_USER: ${POSTGRES_USER:-pilotquiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pilotquiz123}
    ports:
      - "5434:5432"
    volumes:
      - postgres_progress_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilotquiz -d progressdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: pilotquiz-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # Kafka for event-driven communication
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pilotquiz-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  postgres_user_data:
  postgres_quiz_data:
  postgres_progress_data:
